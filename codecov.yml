# Codecov configuration
# https://docs.codecov.com/docs/codecovyml-reference

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 85%       # fail PR if overall coverage drops below 85%
        threshold: 1%     # allow up to 1% regression before blocking
    patch:
      default:
        target: 85%       # new/changed lines in a PR must also reach 85%
        threshold: 1%

# Paths excluded from coverage (entry points and generated code)
ignore:
  - "cmd/"
  - "tmp/"
  - "examples/"
  - "internal/ui/wails/"
  - "internal/ui/mock/"
  - "internal/util/config/"

parsers:
  go:
    partials_as_hits: false

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: false
