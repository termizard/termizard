version: '3'

vars:
  APP_NAME: "termizard"
  BIN_DIR: "bin"
  MAIN_PACKAGE: "./cmd/termizard"
  # Target OS for build/package/run. Defaults to the host OS; override with GOOS=windows etc.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application for the current platform
    cmds:
      - task: "{{.GOOS}}:build"

  build:dev:
    summary: Builds a development binary (debug symbols, no strip)
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          DEV: "true"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Builds and runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  test:
    summary: Runs all tests with race detector
    cmds:
      - go test -race -parallel 4 -count=1 ./...

  lint:
    summary: Runs golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    summary: Formats all Go source files
    cmds:
      - gofmt -w ./cmd ./internal
