name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.26'

jobs:
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install task runner
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Sync release version
        run: bash scripts/sync-release-version.sh
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Build DMG installer
        run: task darwin:package ARCH=arm64

      - uses: actions/upload-artifact@v4
        with:
          name: termizard-macos-arm64
          path: |
            bin/termizard
            bin/termizard-macos-arm64.dmg

  build-macos-amd64:
    name: macOS amd64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install task runner
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Sync release version
        run: bash scripts/sync-release-version.sh
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Build DMG installer
        run: task darwin:package ARCH=amd64

      - uses: actions/upload-artifact@v4
        with:
          name: termizard-macos-amd64
          path: |
            bin/termizard
            bin/termizard-macos-amd64.dmg

  build-windows-universal:
    name: Windows amd64+arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisCandidates = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "$env:ProgramFiles\NSIS"
          )
          $nsisDir = $null
          foreach ($dir in $nsisCandidates) {
            if (Test-Path "$dir\makensis.exe") {
              $nsisDir = $dir
              break
            }
          }
          if (-not $nsisDir) {
            throw "makensis.exe not found after NSIS install"
          }
          Write-Host "NSIS directory: $nsisDir"
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          & "$nsisDir\makensis.exe" /VERSION

      - name: Install task runner
        shell: bash
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Sync release version
        shell: bash
        run: bash scripts/sync-release-version.sh
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Build universal NSIS installer (amd64 + arm64)
        shell: pwsh
        run: task windows:package:universal INSTALL_SCOPE=user

      - uses: actions/upload-artifact@v4
        with:
          name: termizard-windows-universal
          path: bin/termizard-amd64_arm64-installer.exe

  build-linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install task runner
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Sync release version
        run: bash scripts/sync-release-version.sh
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Build .deb package
        run: task linux:create:deb ARCH=amd64

      - uses: actions/upload-artifact@v4
        with:
          name: termizard-linux-amd64
          path: bin/*.deb

  publish:
    name: Publish release assets
    needs:
      - build-macos-arm64
      - build-macos-amd64
      - build-windows-universal
      - build-linux-amd64
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.release.tag_name != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release artifacts
        run: find artifacts -type f | sort

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/**/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
