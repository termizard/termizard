name: CI

# CI Strategy:
# - Pure Go builds: CGO_ENABLED=0 on all platforms (no WebView2, no GTK/WebKit).
# - Race detector requires CGO, so tests run without -race everywhere.
# - Go 1.26+ required (matches go.mod).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for Codecov OIDC token

env:
  GO_VERSION: '1.26'
  GO_PACKAGES: ./cmd/... ./internal/...

jobs:
  build:
    name: Build — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Download and verify dependencies
      run: go mod download && go mod verify

    - name: Build
      shell: bash
      run: |
        EXT=""
        [ "${{ matrix.os }}" = "windows-latest" ] && EXT=".exe"
        CGO_ENABLED=0 go build -tags production -trimpath \
          -ldflags="-w -s" \
          -o "termizard${EXT}" ./cmd/termizard

  test:
    name: Test — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run go vet
      if: matrix.os == 'ubuntu-latest'
      run: CGO_ENABLED=0 go vet ${{ env.GO_PACKAGES }}

    - name: Test
      shell: bash
      run: CGO_ENABLED=0 go test -parallel 4 -coverprofile=coverage.txt -covermode=atomic ${{ env.GO_PACKAGES }}

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v5
      with:
        use_oidc: true
        files: ./coverage.txt
        flags: unittests
        name: codecov-termizard
        fail_ci_if_error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m ${{ env.GO_PACKAGES }}
      env:
        CGO_ENABLED: "0"

  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Check formatting
      run: |
        UNFORMATTED=$(gofmt -l $(go list -f '{{.Dir}}' ${{ env.GO_PACKAGES }} | sort -u))
        if [ -n "$UNFORMATTED" ]; then
          echo "ERROR: The following files are not formatted:"
          echo "$UNFORMATTED"
          echo ""
          echo "Run 'gofmt -w' on the files above."
          exit 1
        fi
        echo "All files are properly formatted"

  deps:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Install go-mod-outdated
      run: go install github.com/psampaz/go-mod-outdated@latest

    - name: Check all dependencies
      run: |
        echo "## All Dependencies Status"
        go list -u -m -json all 2>/dev/null | go-mod-outdated -style markdown || true

    - name: Check direct dependencies for updates
      run: |
        echo "## Direct Dependencies with Available Updates"
        OUTDATED=$(go list -u -m -json all 2>/dev/null | go-mod-outdated -update -direct || true)
        if [ -n "$OUTDATED" ]; then
          echo "$OUTDATED"
          echo ""
          echo "::warning::Some direct dependencies have updates available"
        else
          echo "All direct dependencies are up to date!"
        fi
