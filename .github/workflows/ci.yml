name: CI

# CI Strategy:
# - Core library tests run on Linux, macOS, and Windows (CGO_ENABLED=0, no Wails)
# - Application build requires embedded frontend dist + CGO on Unix (Wails v3)
# - Go 1.26+ required (matches go.mod requirement)
#
# Branch Strategy (GitHub Flow):
# - main branch: Production-ready code
# - Feature branches: Tested via pull_request trigger
# - Pull requests: Must pass all checks before merge

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for Codecov OIDC token

env:
  GO_PACKAGES: ./cmd/... ./internal/...
  # Wails UI needs embedded frontend + CGO; covered by build/lint jobs.
  GO_CORE_PACKAGES: ./internal/adapter/... ./internal/config/... ./internal/core/... ./internal/ui/mock/... ./internal/util/...

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: internal/ui/wails/frontend/package-lock.json

    - name: Build frontend
      run: |
        cd internal/ui/wails/frontend
        npm ci
        npm run build

    - name: Install Linux GUI build dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build application
      shell: bash
      run: |
        OUT=termizard
        if [ "${{ matrix.os }}" = "windows-latest" ]; then OUT=termizard.exe; fi
        go build -tags production -o "$OUT" ./cmd/termizard
      env:
        CGO_ENABLED: ${{ matrix.os == 'windows-latest' && '0' || '1' }}

  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run go vet
      if: matrix.os == 'ubuntu-latest'
      run: go vet ${{ env.GO_CORE_PACKAGES }}
      env:
        CGO_ENABLED: "0"

    - name: Run tests with race detector
      shell: bash
      run: |
        FLAGS="-parallel 1 -coverprofile=coverage.txt -covermode=atomic"
        PKGS="${{ env.GO_CORE_PACKAGES }}"
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          CGO_ENABLED=0 go test $FLAGS $PKGS
        else
          CGO_ENABLED=1 go test -race $FLAGS $PKGS
        fi

    - name: Verify coverage file
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        if [ -f coverage.txt ]; then
          echo "coverage.txt found ($(wc -l < coverage.txt) lines)"
        else
          echo "coverage.txt not found, generating separately..."
          CGO_ENABLED=0 go test -coverprofile=coverage.txt -covermode=atomic ${{ env.GO_CORE_PACKAGES }} || true
        fi

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v5
      with:
        use_oidc: true
        files: ./coverage.txt
        flags: unittests
        name: codecov-termizard
        fail_ci_if_error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: internal/ui/wails/frontend/package-lock.json

    - name: Build frontend
      run: |
        cd internal/ui/wails/frontend
        npm ci
        npm run build

    - name: Install Linux GUI build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m ./cmd/... ./internal/...
      env:
        CGO_ENABLED: "1"

  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true

    - name: Check formatting
      run: |
        UNFORMATTED=$(gofmt -l $(go list -f '{{.Dir}}' ./cmd/... ./internal/... | sort -u))
        if [ -n "$UNFORMATTED" ]; then
          echo "ERROR: The following files are not formatted:"
          echo "$UNFORMATTED"
          echo ""
          echo "Run 'gofmt -w' on the files above."
          exit 1
        fi
        echo "All files are properly formatted"

  deps:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true

    - name: Install go-mod-outdated
      run: go install github.com/psampaz/go-mod-outdated@latest

    - name: Check all dependencies
      run: |
        echo "## All Dependencies Status"
        go list -u -m -json all 2>/dev/null | go-mod-outdated -style markdown || true

    - name: Check direct dependencies for updates
      run: |
        echo "## Direct Dependencies with Available Updates"
        OUTDATED=$(go list -u -m -json all 2>/dev/null | go-mod-outdated -update -direct || true)
        if [ -n "$OUTDATED" ]; then
          echo "$OUTDATED"
          echo ""
          echo "::warning::Some direct dependencies have updates available"
        else
          echo "All direct dependencies are up to date!"
        fi
