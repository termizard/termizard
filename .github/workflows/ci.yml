name: CI

# CI Strategy:
# - Tests run on Linux, macOS, and Windows (cross-platform terminal library)
# - Go 1.26+ required (matches go.mod requirement)
# - CGO_ENABLED=0: Pure Go, no C compiler required
# - Race detection via github.com/kolkov/racedetector (no CGO needed)
#
# Branch Strategy (GitHub Flow):
# - main branch: Production-ready code
# - Feature branches: Tested via pull_request trigger
# - Pull requests: Must pass all checks before merge

env:
  CGO_ENABLED: "0"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write  # Required for Codecov OIDC token

jobs:
  # Build verification - Cross-platform
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build all packages
      run: go build ./...

  # Unit tests - Cross-platform
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run go vet
      if: matrix.os == 'ubuntu-latest'
      run: go vet ./...

    - name: Install race detector
      run: go install github.com/kolkov/racedetector/cmd/racedetector@latest

    - name: Run tests with race detector
      shell: bash
      run: racedetector test -v -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Verify coverage file
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        if [ -f coverage.txt ]; then
          echo "coverage.txt found ($(wc -l < coverage.txt) lines)"
        else
          echo "coverage.txt not found, generating separately..."
          go test -coverprofile=coverage.txt -covermode=atomic ./... || true
        fi

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v5
      with:
        use_oidc: true
        files: ./coverage.txt
        flags: unittests
        name: codecov-termizard
        fail_ci_if_error: true

  # Linting
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m

  # Code formatting check
  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "ERROR: The following files are not formatted:"
          gofmt -l .
          echo ""
          echo "Run 'go fmt ./...' to fix formatting issues."
          exit 1
        fi
        echo "All files are properly formatted"

  # Dependency freshness check (non-blocking)
  deps:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true

    - name: Install go-mod-outdated
      run: go install github.com/psampaz/go-mod-outdated@latest

    - name: Check all dependencies
      run: |
        echo "## All Dependencies Status"
        go list -u -m -json all 2>/dev/null | go-mod-outdated -style markdown || true

    - name: Check direct dependencies for updates
      run: |
        echo "## Direct Dependencies with Available Updates"
        OUTDATED=$(go list -u -m -json all 2>/dev/null | go-mod-outdated -update -direct || true)
        if [ -n "$OUTDATED" ]; then
          echo "$OUTDATED"
          echo ""
          echo "::warning::Some direct dependencies have updates available"
        else
          echo "All direct dependencies are up to date!"
        fi
