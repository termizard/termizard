# GolangCI-Lint v2.5 Configuration for TERMizard - Pure Go Terminal Emulator & TUI
# Documentation: https://golangci-lint.run/docs/configuration/

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    # Code quality and complexity
    - gocyclo
    - gocognit
    - funlen
    - maintidx
    - cyclop
    - nestif

    # Bug detection
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - gosec
    - nilnil
    - nilerr
    - ineffassign

    # Code style and consistency
    - misspell
    - whitespace
    - unconvert
    - unparam

    # Naming conventions
    - errname
    - revive

    # Performance
    - prealloc
    - bodyclose
    - makezero

    # Code practices
    - goconst
    - gocritic
    - goprintffuncname
    - nolintlint
    - nakedret

    # Additional quality checkers
    - dupl
    - dogsled
    - durationcheck

  settings:
    govet:
      enable:
        - copylocks
      disable:
        - fieldalignment

    gocyclo:
      # Terminal emulation core can be complex but should be kept manageable
      min-complexity: 20

    cyclop:
      max-complexity: 20

    funlen:
      # Some terminal state machines can be longer
      lines: 120
      statements: 60

    gocognit:
      min-complexity: 30

    misspell:
      locale: US

    nestif:
      min-complexity: 4

    revive:
      rules:
        - name: var-naming
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

      disabled-checks:
        - commentFormatting
        - whyNoLint
        - unnamedResult
        - commentedOutCode
        - octalLiteral
        - paramTypeCombine

      settings:
        hugeParam:
          sizeThreshold: 256

  exclusions:
    paths:
      - build
      - frontend/node_modules
    rules:
      # Test files - allow more flexibility
      - path: _test\.go
        linters:
          - gocyclo
          - cyclop
          - funlen
          - maintidx
          - errcheck
          - gosec
          - goconst
          - dupl
          - gocognit

      # Terminal emulation core - complex by nature, many escape codes
      - path: internal/core/terminal/.*\.go
        linters:
          - funlen
          - gocyclo
          - cyclop
          - gocognit
          - nestif
          - gosec
          - dupl
          - gocritic
          - maintidx

      # GPU terminal UI — renderer and event loop are inherently complex
      - path: internal/ui/gogpu/.*\.go
        linters:
          - gocognit
          - nestif
          - gocyclo
          - cyclop
          - funlen
          - maintidx

      # Pseudo-terminal proxy - low-level system interactions
      - path: internal/core/pty/.*\.go
        linters:
          - gosec
          - errcheck
          - funlen
          - unparam

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
