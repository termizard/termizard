# GolangCI-Lint v2.5 Configuration for TERMizard - Pure Go Terminal Emulator & TUI
# Documentation: https://golangci-lint.run/docs/configuration/

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    # Code quality and complexity
    - gocyclo
    - gocognit
    - funlen
    - maintidx
    - cyclop
    - nestif

    # Bug detection
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - gosec
    - nilnil
    - nilerr
    - ineffassign

    # Code style and consistency
    - misspell
    - whitespace
    - unconvert
    - unparam

    # Naming conventions
    - errname
    - revive

    # Performance
    - prealloc
    - bodyclose
    - makezero

    # Code practices
    - goconst
    - gocritic
    - goprintffuncname
    - nolintlint
    - nakedret

    # Additional quality checkers
    - dupl
    - dogsled
    - durationcheck

  settings:
    govet:
      enable:
        - copylocks
      disable:
        - fieldalignment

    gocyclo:
      # Terminal emulation core can be complex but should be kept manageable
      min-complexity: 20

    cyclop:
      max-complexity: 20

    funlen:
      # Some terminal state machines can be longer
      lines: 120
      statements: 60

    gocognit:
      min-complexity: 30

    misspell:
      locale: US

    nestif:
      min-complexity: 4

    revive:
      rules:
        - name: var-naming
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

      disabled-checks:
        - commentFormatting
        - whyNoLint
        - unnamedResult
        - commentedOutCode
        - octalLiteral
        - paramTypeCombine

      settings:
        hugeParam:
          sizeThreshold: 256

  exclusions:
    rules:
      # Test files - allow more flexibility
      - path: _test\.go
        linters:
          - gocyclo
          - cyclop
          - funlen
          - maintidx
          - errcheck
          - gosec
          - goconst
          - dupl
          - gocognit

      # Terminal emulation core - complex by nature, many escape codes
      - path: term/.*\.go
        linters:
          - funlen       # State machines may be long
          - gocyclo      # Many escape code paths
          - cyclop       # Switch cases for CSI sequences
          - nestif       # Necessary nested logic for screen operations
          - dupl         # Some terminal sequences repeat structure

      # Pseudo-terminal proxy - low-level system interactions
      - path: ptp/.*\.go
        linters:
          - gosec        # Syscall usage is intentional
          - errcheck     # Some POSIX returns are informational
          - funlen       # PTY setup can be verbose
          - unparam      # Signals handler signatures required by OS

      # Widget library - public API may be verbose
      - path: widgets/.*\.go
        linters:
          - funlen       # Widget constructors have many options
          - gocognit     # Layout logic can be inherently complex

      # Rendering engine - diff algorithms and screen updates
      - path: render/.*\.go
        linters:
          - gocyclo      # Diff and update algorithms
          - funlen       # Rendering loops may be long
          - nestif       # Complexity from color and attribute handling

      # Escape sequence parser - generated or table-driven code
      - path: parser/.*\.go
        linters:
          - dupl         # Parser tables repeat similar entries
          - gocyclo      # Dispatch logic for escape sequences

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
