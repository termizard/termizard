name: "termizard"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "GPU-accelerated terminal emulator"
vendor: "termizard"
homepage: "https://github.com/termizard/termizard"
license: "MIT"
release: "1"

contents:
  - src: "./bin/termizard"
    dst: "/usr/local/bin/termizard"
  - src: "./assets/logo.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/termizard.png"
  - src: "./build/linux/termizard.desktop"
    dst: "/usr/share/applications/termizard.desktop"

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"
