version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the Linux binary
    deps:
      - task: common:go:mod:tidy
    cmds:
      - |
        go build -tags production -trimpath -buildvcs=false \
          -ldflags="-w -s" \
          -o "{{.OUTPUT | default (printf \"%s/%s\" .BIN_DIR .APP_NAME)}}" {{.MAIN_PACKAGE}}
    env:
      GOOS: linux
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages the application for Linux (deb + AppImage)
    deps:
      - task: build
    cmds:
      - task: create:deb
      - task: create:appimage

  create:deb:
    summary: Creates a .deb package via nfpm
    preconditions:
      - sh: command -v nfpm >/dev/null 2>&1
        msg: "nfpm is required. Install: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest"
    cmds:
      - nfpm package --config ./build/linux/nfpm/nfpm.yaml --packager deb --target {{.ROOT_DIR}}/bin
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:appimage:
    summary: Creates an AppImage
    dir: build/linux/appimage
    deps:
      - task: build
      - task: generate:dotdesktop
    preconditions:
      - sh: command -v appimagetool >/dev/null 2>&1
        msg: "appimagetool is required. See https://appimage.github.io/appimagetool/"
    cmds:
      - cp "../../../{{.BIN_DIR}}/{{.APP_NAME}}" "{{.APP_NAME}}"
      - cp "../../../assets/logo.png" "{{.APP_NAME}}.png"
      - |
        mkdir -p "build/{{.APP_NAME}}.AppDir/usr/bin"
        cp "{{.APP_NAME}}" "build/{{.APP_NAME}}.AppDir/usr/bin/"
        cp "{{.APP_NAME}}.png" "build/{{.APP_NAME}}.AppDir/"
        cp "../{{.APP_NAME}}.desktop" "build/{{.APP_NAME}}.AppDir/"
        ARCH={{.ARCH | default ARCH}} appimagetool "build/{{.APP_NAME}}.AppDir" "../../../bin/{{.APP_NAME}}-{{.ARCH | default ARCH}}.AppImage"
    vars:
      APP_NAME: '{{.APP_NAME}}'

  generate:dotdesktop:
    summary: Generates a .desktop file
    cmds:
      - mkdir -p {{.ROOT_DIR}}/build/linux
      - |
        cat > {{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop <<EOF
        [Desktop Entry]
        Type=Application
        Name={{.APP_NAME}}
        Exec={{.APP_NAME}}
        Icon={{.APP_NAME}}
        Comment=termizard terminal emulator
        Categories=Development;
        Terminal=false
        EOF

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
