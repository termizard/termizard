version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # Universal/multi-arch builds invoke this concurrently from parallel deps;
    # two `go mod tidy` processes racing on go.mod can corrupt it.
    run: once
    cmds:
      - go mod tidy

  prepare:appicon:
    summary: Copies assets/logo.png for installer and shortcut icons
    run: once
    cmds:
      - cp assets/logo.png build/appicon.png
    sources:
      - assets/logo.png
    generates:
      - build/appicon.png

  generate:icons:
    summary: Generates Windows .ico and Mac .icns from assets/logo.png
    run: once
    deps:
      - task: prepare:appicon
    dir: build
    sources:
      - "../assets/logo.png"
      - "appicon.png"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - bash scripts/gen-icons.sh
