version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the Windows binary
    deps:
      - task: common:go:mod:tidy
      - task: embed:manifest
    cmds:
      - |
        go build -tags production -trimpath -buildvcs=false \
          -ldflags="-w -s -H windowsgui" \
          -o "{{.OUTPUT | default (printf \"%s/%s.exe\" .BIN_DIR .APP_NAME)}}" {{.MAIN_PACKAGE}}
      - rm -f cmd/termizard/resource.syso
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'

  build:console:
    summary: Builds a console-subsystem binary (visible stdout/stderr for debugging)
    deps:
      - task: common:go:mod:tidy
      - task: embed:manifest
    cmds:
      - |
        go build -tags production -trimpath -buildvcs=false \
          -ldflags="-w -s" \
          -o "{{.BIN_DIR}}/{{.APP_NAME}}-console.exe" {{.MAIN_PACKAGE}}
      - rm -f cmd/termizard/resource.syso
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'

  embed:manifest:
    summary: Embeds Windows app manifest and version info via goversioninfo
    run: once
    cmds:
      - go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
      - |
        goversioninfo \
          -icon=build/windows/icon.ico \
          -manifest=build/windows/app.manifest \
          -o cmd/termizard/resource.syso \
          build/windows/versioninfo.json
    sources:
      - build/windows/versioninfo.json
      - build/windows/app.manifest
      - build/windows/icon.ico
    generates:
      - cmd/termizard/resource.syso

  package:universal:
    summary: Packages amd64 + arm64 Windows binaries in one NSIS installer
    cmds:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-amd64.exe'
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-arm64.exe'
      - task: create:nsis:installer:universal
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  package:
    summary: Packages the application as an NSIS installer
    deps:
      - task: build
    cmds:
      - task: create:nsis:installer
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  create:nsis:installer:
    summary: Creates an NSIS installer for a single arch
    dir: build/windows/nsis
    preconditions:
      - sh: '[ "{{.INSTALL_SCOPE}}" = "user" ] || [ "{{.INSTALL_SCOPE}}" = "machine" ]'
        msg: "INSTALL_SCOPE must be 'user' or 'machine'"
    cmds:
      - |
        {{if eq OS "windows"}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DINSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_AMD64_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DINSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_AMD64_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
    vars:
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  create:nsis:installer:universal:
    summary: Creates an NSIS installer with amd64 and arm64 binaries
    dir: build/windows/nsis
    preconditions:
      - sh: '[ "{{.INSTALL_SCOPE}}" = "user" ] || [ "{{.INSTALL_SCOPE}}" = "machine" ]'
        msg: "INSTALL_SCOPE must be 'user' or 'machine'"
    cmds:
      - |
        {{if eq OS "windows"}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DINSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_AMD64_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}-amd64.exe" -DARG_ARM64_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}-arm64.exe" project.nsi
        {{else}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DINSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_AMD64_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-amd64.exe" -DARG_ARM64_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-arm64.exe" project.nsi
        {{end}}
    vars:
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
